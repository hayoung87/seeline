<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>제품 상세 · 내 공간 배치 | 디자인시선</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="selection.css"></head><body><a class="skip-link" href="#main">본문 바로가기</a><header class="site-header"><div class="wrap header-inner"><a class="logo" href="index.html">디자인시선</a><a href="selection.html">← 셀렉션 목록</a></div></header><main id="main"><section class="section"><div class="wrap"><div id="detail" class="detail-grid"></div></div></section>
<section id="planner" class="section section-alt"><div class="wrap"><p class="hero-kicker">MY SPACE</p><h2 class="section-title">우리 집에 배치해 보기</h2><div class="mode-buttons"><button type="button" id="planMode" aria-pressed="true">치수로 배치</button><button type="button" id="photoMode" aria-pressed="false">집 사진에 배치</button></div><div class="planner-grid"><div class="planner-controls"><label>내 공간<select id="space"><option>거실</option><option>다이닝</option><option>기타 공간</option></select></label><label>제품 구성<select id="variant"></select></label><label>공간 가로 (mm)<input id="roomW" type="number" value="4000" min="500" max="20000" step="10"></label><label>공간 깊이 (mm)<input id="roomD" type="number" value="3500" min="500" max="20000" step="10"></label><label id="photoInputLabel" hidden>집 내부 사진<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label id="scaleLabel" hidden>사진 속 표시 크기 (시각 조절)<input id="scale" type="range" min="10" max="90" value="40"></label><button id="reset" type="button">중앙으로 초기화</button></div><div><div class="stage-shell"><div id="stage" class="stage" aria-label="가구 배치 화면"><img id="roomPhoto" class="room-photo" alt="선택한 집 내부 사진" hidden><div id="furniture" class="furniture" tabindex="0" role="button" aria-label="배치 가구: 드래그 또는 방향키로 이동"></div></div></div><div class="move-controls" aria-label="가구 위치 조절"><button data-move="up" aria-label="위로 이동">↑</button><button data-move="left" aria-label="왼쪽으로 이동">←</button><button id="rotate" aria-label="90도 회전">↻</button><button data-move="right" aria-label="오른쪽으로 이동">→</button><button data-move="down" aria-label="아래로 이동">↓</button></div><p id="position" aria-live="polite"></p><p id="plannerStatus" class="planner-status" role="status"></p><p id="modeNote" class="work-note"></p><p class="work-note">사진은 이 브라우저에서만 열며 서버로 업로드하지 않습니다. 평면도는 직사각형 공간과 제품의 외곽 크기를 기준으로 하며, 문·기둥·반입 경로는 별도 확인해야 합니다.</p></div></div></div></section></main><script src="catalog.js"></script><script src="product.js"></script></body></html>
