<section id="planner" class="section section-alt"><div class="wrap"><p class="hero-kicker">MY SPACE</p><h2 class="section-title">우리 집에 배치해 보기</h2><div class="mode-buttons"><button type="button" id="planMode" aria-pressed="true">치수로 배치</button><button type="button" id="photoMode" aria-pressed="false">집 사진에 배치</button></div><div class="planner-grid"><div class="planner-controls"><label>내 공간<select id="space"><option>거실</option><option>다이닝</option><option>기타 공간</option></select></label><label>제품 구성<select id="variant"></select></label><label>공간 가로 (mm)<input id="roomW" type="number" value="4000" min="500" max="20000" step="10"></label><label>공간 깊이 (mm)<input id="roomD" type="number" value="3500" min="500" max="20000" step="10"></label><label id="photoInputLabel" hidden>집 내부 사진<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>공간 높이 (mm)<input id="roomH" type="number" value="2400" min="500" max="10000" step="10"></label><label id="viewLabel">치수 화면<select id="view"><option value="front">정면 입면도</option><option value="three">공간 3D 보기</option></select></label><button id="calibrate" type="button" hidden>사진 기준점 초기화</button><button id="reset" type="button">중앙으로 초기화</button></div><div><div class="stage-shell"><div id="stage" class="stage" aria-label="가구 배치 화면"><img id="roomPhoto" class="room-photo" alt="선택한 집 내부 사진" hidden><svg id="scene" viewBox="0 0 1000 750" preserveAspectRatio="none" role="img" aria-label="실측 비율 가구 배치"></svg><div id="furniture" class="furniture" tabindex="0" role="button" aria-label="배치 가구: 드래그 또는 방향키로 이동"></div></div></div><div class="move-controls" aria-label="가구 위치 조절"><button data-move="up" aria-label="위로 이동">↑</button><button data-move="left" aria-label="왼쪽으로 이동">←</button><button id="rotate" aria-label="90도 회전">↻</button><button data-move="right" aria-label="오른쪽으로 이동">→</button><button data-move="down" aria-label="아래로 이동">↓</button></div><p id="position" aria-live="polite"></p><p id="plannerStatus" class="planner-status" role="status"></p><p id="modeNote" class="work-note"></p><p class="work-note">사진은 이 브라우저에서만 열며 서버로 업로드하지 않습니다. 입력한 실측 크기로 구성별 외곽 비율을 계산합니다. 형상은 배치용 간략 모델이며 실제 옵션의 3D 스캔이나 제작 도면이 아닙니다. 문·기둥·반입 경로는 별도 확인해 주세요.</p></div></div></div></section><section class="product-next-step wrap"><h2>우리 집 인테리어와 함께 살펴볼까요?</h2><p>선택한 제품 구성과 공간 치수를 장바구니에 담아 공간 상담으로 이어가세요.</p><div><button type="button" class="button button-primary" id="savePlacement">선택한 구성 장바구니 담기 +</button><a class="button outline-button" href="cart.html">장바구니 · 공간 상담 ↗</a></div><p id="placementSaveStatus" role="status"></p></section></main><script src="catalog.js"></script><script src="cart.js"></script><script src="placement.js"></script><script src="product.js"></script></body></html>
